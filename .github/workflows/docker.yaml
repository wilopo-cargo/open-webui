name: Build and publish standard Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - v*

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare environment
        run: echo "FULL_IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=git-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}

      - name: Extract metadata for Docker cache
        id: cache-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            ${{ github.ref_type == 'tag' && 'type=raw,value=main' || '' }}
          flavor: |
            prefix=cache-main-linux-amd64-
            latest=false

      - name: Build and publish Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache-meta.outputs.tags }}
          cache-to: type=registry,ref=${{ steps.cache-meta.outputs.tags }},mode=max
          sbom: true
          build-args: BUILD_HASH=${{ github.sha }}

  notify-helm-charts:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Create Helm charts app token
        id: helm-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HELM_CHARTS_APP_ID }}
          private-key: ${{ secrets.HELM_CHARTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: helm-charts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify published Open WebUI image
        id: image
        run: |
          set -euo pipefail

          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          ref_name="${GITHUB_REF_NAME}"

          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            image_tag="dev"
          else
            image_tag="${ref_name#v}"
          fi

          docker buildx imagetools inspect "${image_name}:${image_tag}"
          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch Helm chart automation
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.helm-app-token.outputs.token }}
          script: |
            const isDev = context.ref === 'refs/heads/dev';
            const eventType = isDev
              ? 'open-webui-dev-image-published'
              : 'open-webui-release-published';
            const refName = context.ref.replace('refs/heads/', '').replace('refs/tags/', '');
            const appVersion = refName.startsWith('v') ? refName.slice(1) : refName;
            const payload = {
              image_tag: isDev ? 'dev' : appVersion,
              source_ref: context.ref,
              source_sha: context.sha,
              source_run_id: String(context.runId),
              source_repository: context.repo.repo,
            };

            if (!isDev) {
              payload.app_version = appVersion;
            }

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: 'helm-charts',
              event_type: eventType,
              client_payload: payload,
            });
